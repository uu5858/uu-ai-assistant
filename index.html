<style>
:root{
  --yellow:#B8A6D9; --soft-yellow:#D8CBEE; --light-yellow:#F4EEFA;
  --pink:#D9A6C2; --soft-pink:#EFCBDF; --light-pink:#FCEFF6;
  --blue:#B3A6D6; --soft-blue:#D6CCEC; --light-blue:#F3EFFA;
  --sage:#C3A9CC; --light-sage:#F5ECF2;
  --cream:#FCF6FA; --bg:#FDFAFC; --dark:#3D3542; --medium:#6E6076; --gray:#A79BAE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC",sans-serif;padding-bottom:76px;}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:10;background:var(--light-yellow);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 2px 8px rgba(0,0,0,.05);}
header h1{margin:0;font-size:18px;font-weight:700;}
header p{margin:2px 0 0;font-size:13px;color:var(--medium);}
main{max-width:640px;margin:0 auto;padding:14px;}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
.quote{background:var(--light-yellow);border-radius:14px;padding:16px;font-weight:700;font-size:15px;line-height:1.6;}
.big-task{background:var(--light-pink);border-radius:14px;padding:14px;margin-top:8px;}
.big-task .txt{font-size:15px;font-weight:700;margin:6px 0;padding:6px 4px;border-bottom:2px dashed var(--pink)!important;background:rgba(255,255,255,.35)!important;border-radius:6px;}
.big-task .txt::placeholder{color:var(--medium);opacity:.8;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft-blue);color:#fff;margin-right:4px;}
textarea,input[type=text]{width:100%;border:1px solid #eee;border-radius:10px;padding:10px;font-family:inherit;font-size:14px;background:var(--cream);resize:vertical;}
button{border:none;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--yellow);color:var(--dark);}
button.ghost{background:var(--light-blue);}
button.sm{padding:6px 10px;font-size:12px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.idea-item{border-bottom:1px solid #f1f1ee;padding:10px 0;}
.idea-item .meta{font-size:11px;color:var(--gray);margin-top:4px;}
.idea-item.used{opacity:.5;}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;background:var(--light-sage);margin:2px 4px 2px 0;cursor:pointer;}
.pill.active{background:var(--sage);color:#fff;}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:10;}
nav.tabs button{background:none;color:var(--gray);font-size:11px;flex:1;padding:6px 2px;}
nav.tabs button.active{color:var(--pink);}
.view{display:none;} .view.active{display:block;}
.goal-list li{margin-bottom:4px;font-size:14px;}
select{border-radius:10px;padding:8px;border:1px solid #eee;background:var(--cream);font-family:inherit;}
input[type=date]{border-radius:10px;padding:8px;border:1px solid #eee;background:var(--cream);font-family:inherit;font-size:13px;color:var(--medium);}
.toggle{display:flex;background:var(--light-sage);border-radius:10px;overflow:hidden;}
.toggle button{background:none;border-radius:0;flex:1;color:var(--medium);}
.toggle button.on{background:var(--sage);color:#fff;}
.stat{text-align:center;flex:1;}
.stat b{display:block;font-size:20px;}
.stat span{font-size:11px;color:var(--gray);}
.content-box{white-space:pre-wrap;background:var(--light-blue);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;margin-top:8px;}
</style>
</head>
<body>
<header>
  <h1>🐥 uu AI 小助手</h1>
  <p id="dateLine"></p>
</header>
<main>

<div id="view-home" class="view active">
  <div class="card"><h2>🔋 今日能量金句</h2><div class="quote" id="quoteBox"></div></div>

  <div class="card">
    <h2 id="taskHeading">☀️ 今日偉大事件</h2>
    <div class="row" id="dateQuickPicks" style="margin-bottom:8px;"></div>
    <input type="date" id="customDatePick" onchange="selectDate(this.value)" style="margin-bottom:8px;">
    <div class="row"><span style="font-size:13px;color:var(--medium)" id="dayTypeLabel">今天</span>
      <div class="toggle"><button id="btnWork" onclick="setDayType('work')">時間有限</button><button id="btnOff" onclick="setDayType('off')">時間充裕</button></div>
    </div>
    <div id="taskArea"></div>
  </div>

  <div class="card">
    <h2>🧠 快速記錄靈感</h2>
    <textarea id="quickIdea" rows="2" placeholder="想到什麼就打什麼..." oninput="saveDraft('quickIdea', this.value)"></textarea>
    <div class="row" style="margin-top:8px;justify-content:flex-end;"><button onclick="quickAddIdea()">記錄</button></div>
    <div id="recentIdeas" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <h2>🎯 本週／本月目標</h2>
    <div id="homeGoals"></div>
  </div>

  <div class="card">
    <h2>💬 今天想讓我幫你做什麼？</h2>
    <div class="row">
      <button class="ghost sm" onclick="go('ideas')">💡 記錄靈感</button>
      <button class="ghost sm" onclick="go('content')">✍🏼 幫我做成貼文</button>
      <button class="ghost sm" onclick="go('review')">🔍 幫我復盤</button>
      <button class="ghost sm" onclick="go('goals')">🎯 目標規劃</button>
    </div>
  </div>
</div>

<div id="view-ideas" class="view">
  <div class="card">
    <h2>🧠 新增靈感</h2>
    <textarea id="newIdea" rows="2" placeholder="今天看書看到..." oninput="saveDraft('newIdea', this.value)"></textarea>
    <div class="row" style="margin-top:8px;">
      <select id="newIdeaCat">
        <option value="">🤖 自動判斷分類</option>
        <option value="讀書心得">📚 讀書心得</option>
        <option value="AI／軟體／產品想法">🛠️ AI／軟體／產品想法</option>
        <option value="感謝">🙏 感謝</option>
        <option value="心情／反思">💭 心情／反思</option>
        <option value="想做的事情">🚀 想做的事情</option>
        <option value="想分享的內容">💡 想分享的內容</option>
        <option value="其他">📝 其他</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px;justify-content:flex-end;"><button onclick="addIdea()">儲存</button></div>
  </div>
  <div class="card">
    <h2>靈感庫</h2>
    <input type="text" id="searchIdea" placeholder="搜尋靈感..." oninput="renderIdeas()">
    <div class="row" id="filterPills" style="margin-top:8px;"></div>
    <div id="ideaList" style="margin-top:8px;"></div>
  </div>
</div>

<div id="view-content" class="view">
  <div class="card">
    <h2>✍🏼 內容規劃</h2>
    <p style="font-size:13px;color:var(--medium);margin-top:0;">選一個未使用的靈感，或直接輸入內容</p>
    <select id="ideaPicker" onchange="fillFromIdea()"></select>
    <textarea id="contentSource" rows="3" placeholder="或直接輸入想分享的內容..." style="margin-top:8px;" oninput="saveDraft('contentSource', this.value)"></textarea>
    <div class="row" style="margin-top:8px;">
      <select id="contentType">
        <option value="threadsLong">Threads 長文</option>
        <option value="threadsShort">Threads 短文</option>
        <option value="reels">60秒 Reels 口播</option>
        <option value="story">IG 限動</option>
        <option value="carousel">IG 輪播</option>
      </select>
      <button onclick="generateContent()">產生內容</button>
    </div>
    <div id="genResult"></div>
  </div>
  <div class="card">
    <h2>📚 內容紀錄</h2>
    <div id="contentList"></div>
  </div>
</div>

<div id="view-goals" class="view">
  <div class="card">
    <h2>🎯 本月目標</h2>
    <div class="row"><input type="text" id="monthlyInput" placeholder="新增本月目標" oninput="saveDraft('monthlyInput', this.value)"><button class="sm" onclick="addGoal('monthly')">新增</button></div>
    <ul class="goal-list" id="monthlyList"></ul>
  </div>
  <div class="card">
    <h2>📅 本週目標</h2>
    <div class="row"><input type="text" id="weeklyInput" placeholder="新增本週目標" oninput="saveDraft('weeklyInput', this.value)"><button class="sm" onclick="addGoal('weekly')">新增</button></div>
    <ul class="goal-list" id="weeklyList"></ul>
  </div>
  <div class="card">
    <h2>🌱 未來想做（不代表現在要做）</h2>
    <div class="row"><input type="text" id="futureInput" placeholder="未來想做的事" oninput="saveDraft('futureInput', this.value)"><button class="sm" onclick="addGoal('future')">新增</button></div>
    <ul class="goal-list" id="futureList"></ul>
  </div>
</div>

<div id="view-review" class="view">
  <div class="card">
    <h2>🔍 復盤</h2>
    <div class="toggle" id="reviewTabs">
      <button class="on" onclick="setReviewType('daily')">每日</button>
      <button onclick="setReviewType('weekly')">每週</button>
      <button onclick="setReviewType('monthly')">每月</button>
    </div>
    <div id="reviewForm" style="margin-top:10px;"></div>
    <div class="row" style="margin-top:8px;justify-content:flex-end;"><button onclick="saveReview()">儲存復盤</button></div>
  </div>
  <div class="card">
    <h2>過去復盤紀錄</h2>
    <div id="reviewList"></div>
  </div>
</div>

<div id="view-dashboard" class="view">
  <div class="card">
    <h2>📊 儀表板</h2>
    <div class="row" id="dashStats"></div>
  </div>
  <div class="card">
    <h2>💾 備份</h2>
    <div class="row">
      <button class="ghost" onclick="exportData()">匯出 JSON</button>
      <label class="ghost" style="border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--light-blue);">
        匯入 JSON<input type="file" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </div>
  </div>
</div>

</main>

<nav class="tabs">
  <button data-v="home" onclick="go('home')">🏠<br>首頁</button>
  <button data-v="ideas" onclick="go('ideas')">🧠<br>靈感庫</button>
  <button data-v="content" onclick="go('content')">✍🏼<br>內容</button>
  <button data-v="goals" onclick="go('goals')">🎯<br>目標</button>
  <button data-v="review" onclick="go('review')">🔍<br>復盤</button>
  <button data-v="dashboard" onclick="go('dashboard')">📊<br>總覽</button>
</nav>

<script>
const KEY='uu_ai_assistant_data_v1';
let data = load();
if(!data.drafts) data.drafts = {quickIdea:'', newIdea:'', contentSource:'', monthlyInput:'', weeklyInput:'', futureInput:'', review:{daily:[],weekly:[],monthly:[]}};
if(!data.drafts.review) data.drafts.review = {daily:[],weekly:[],monthly:[]};
if(data.drafts.monthlyInput===undefined) data.drafts.monthlyInput='';
if(data.drafts.weeklyInput===undefined) data.drafts.weeklyInput='';
if(data.drafts.futureInput===undefined) data.drafts.futureInput='';
if(!data.tasksByDate) data.tasksByDate = {};
if(data.todayTask && data.todayTask.date){
  data.tasksByDate[data.todayTask.date] = {tasks: data.todayTask.tasks || [''], dayType: data.dayType || 'work', manual: !!data.todayTask.manual};
  delete data.todayTask;
  delete data.dayType;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {ideas:[], goals:{monthly:[],weekly:[],future:[]}, content:[], reviews:{daily:[],weekly:[],monthly:[]}, tasksByDate:{},
    drafts:{quickIdea:'', newIdea:'', contentSource:'', monthlyInput:'', weeklyInput:'', futureInput:'', review:{daily:[],weekly:[],monthly:[]}}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function saveDraft(key, val){ data.drafts[key] = val; save(); }

const QUOTES = [
 "不用同時完成所有事情，先把眼前這一步做好。",
 "靈感先記下來就好，不用馬上決定要不要做。",
 "今天做一件事，也是在往前走。",
 "休息不是放棄，是讓自己走更久。",
 "你不用是完美的，做出來就已經很好了。",
 "自由是慢慢累積出來的，不是一次到位。",
 "今天先完成一件小事，其他的留給明天。",
 "有些事情本來就需要時間長出來。"
];

function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateStr(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('dateLine').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${w}`;
  return isoDate(d);
}
const today = dateStr();
let selectedDate = today;
function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return isoDate(dt);
}
function dateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const w = ['日','一','二','三','四','五','六'][dt.getDay()];
  if(dateStr===today) return `${m}/${d}（今天）`;
  if(dateStr===addDays(today,1)) return `${m}/${d}（明天）`;
  if(dateStr===addDays(today,2)) return `${m}/${d}（後天）`;
  return `${m}/${d}（週${w}）`;
}
function relativeLabel(dateStr){
  if(dateStr===today) return '今天';
  if(dateStr===addDays(today,1)) return '明天';
  if(dateStr===addDays(today,2)) return '後天';
  return '這天';
}
function getDayRecord(dateStr){
  if(!data.tasksByDate[dateStr]){
    data.tasksByDate[dateStr] = {tasks: dateStr===today ? [suggestTask()] : [''], dayType:'work', manual:false};
  }
  return data.tasksByDate[dateStr];
}
function selectDate(d){
  if(!d) return;
  selectedDate = d;
  document.getElementById('customDatePick').value = d;
  renderTaskArea();
}
function renderDateQuickPicks(){
  const opts = [['今天',today],['明天',addDays(today,1)],['後天',addDays(today,2)]];
  document.getElementById('dateQuickPicks').innerHTML = opts.map(([label,d])=>
    `<span class="pill ${selectedDate===d?'active':''}" onclick="selectDate('${d}')">${label}</span>`).join('');
  document.getElementById('customDatePick').value = selectedDate;
}

function renderQuote(){
  const dayNum = new Date().getDate() + new Date().getMonth()*31;
  document.getElementById('quoteBox').textContent = QUOTES[dayNum % QUOTES.length];
}

// ---------- classification ----------
const CATS = {
  '讀書心得': ['書','讀到','作者','章節'],
  'AI／軟體／產品想法': ['ai','app','工具','軟體','程式','網頁'],
  '感謝': ['謝謝','感謝','感恩'],
  '心情／反思': ['累','開心','難過','幸福','焦慮','壓力','沮喪','感動'],
  '想做的事情': ['想做','想拍','想學','想建立','想開始','計畫'],
  '想分享的內容': ['想分享','想告訴','想說']
};
function classify(text){
  const t = text.toLowerCase();
  for(const [cat, kws] of Object.entries(CATS)){
    if(kws.some(k=>t.includes(k))) return cat;
  }
  return '其他';
}
const CATEGORIES = [...Object.keys(CATS), '其他'];

// ---------- ideas ----------
function addIdeaCommon(text, category){
  if(!text.trim()) return;
  data.ideas.unshift({id:uid(), text:text.trim(), category: category || classify(text), date:today, used:false});
  save();
}
function quickAddIdea(){
  const el = document.getElementById('quickIdea');
  addIdeaCommon(el.value); el.value=''; saveDraft('quickIdea','');
  renderRecentIdeas(); renderHomeGoals();
}
function addIdea(){
  const el = document.getElementById('newIdea');
  const catSel = document.getElementById('newIdeaCat');
  addIdeaCommon(el.value, catSel.value);
  el.value=''; catSel.value=''; saveDraft('newIdea','');
  renderIdeas();
}
function changeCategory(id, cat){
  const it = data.ideas.find(i=>i.id===id);
  if(it){ it.category = cat; save(); renderIdeas(); }
}
function toggleUsed(id){
  const it = data.ideas.find(i=>i.id===id); if(it){ it.used=!it.used; save(); renderIdeas(); }
}
function deleteIdea(id){
  data.ideas = data.ideas.filter(i=>i.id!==id); save(); renderIdeas();
}
let activeFilter = null;
function renderFilterPills(){
  const cats = ['全部',...Object.keys(CATS),'其他'];
  document.getElementById('filterPills').innerHTML = cats.map(c=>
    `<span class="pill ${activeFilter===c||(c==='全部'&&!activeFilter)?'active':''}" onclick="setFilter('${c}')">${c}</span>`).join('');
}
function setFilter(c){ activeFilter = c==='全部'?null:c; renderFilterPills(); renderIdeas(); }
function renderIdeas(){
  renderFilterPills();
  const q = (document.getElementById('searchIdea')?.value||'').toLowerCase();
  const list = data.ideas.filter(i=>
    (!activeFilter || i.category===activeFilter) &&
    (!q || i.text.toLowerCase().includes(q)));
  document.getElementById('ideaList').innerHTML = list.length? list.map(i=>`
    <div class="idea-item ${i.used?'used':''}">
      <div>${escapeHtml(i.text)}</div>
      <div class="meta">${i.date} ·
        <select onchange="changeCategory('${i.id}', this.value)" style="font-size:11px;border-radius:8px;padding:2px 4px;border:1px solid #eee;background:var(--light-blue);">
          ${CATEGORIES.map(c=>`<option value="${c}" ${c===i.category?'selected':''}>${c}</option>`).join('')}
        </select> ${i.used?'✅已使用':''}
      </div>
      <div class="row" style="margin-top:4px;">
        <button class="sm ghost" onclick="toggleUsed('${i.id}')">${i.used?'標記未使用':'標記已使用'}</button>
        <button class="sm ghost" onclick="deleteIdea('${i.id}')">刪除</button>
      </div>
    </div>`).join('') : '<p style="color:var(--gray);font-size:13px;">目前沒有符合的靈感</p>';
}
function renderRecentIdeas(){
  const recent = data.ideas.slice(0,3);
  document.getElementById('recentIdeas').innerHTML = recent.map(i=>
    `<div class="idea-item"><div style="font-size:13px;">${escapeHtml(i.text)}</div><div class="meta"><span class="tag">${escapeHtml(i.category)}</span></div></div>`).join('');
}

// ---------- today task ----------
function setDayType(t){
  getDayRecord(selectedDate).dayType = t; save(); renderTaskArea();
}
let taskSuggestIndex = 0;
function getSuggestionPool(){
  return [
    ...data.goals.weekly.filter(g=>!g.done).map(g=>g.text),
    ...data.ideas.filter(i=>!i.used && i.category==='想做的事情').map(i=>i.text)
  ];
}
function suggestTask(){
  const pool = getSuggestionPool();
  if(!pool.length) return '今天先休息一下，或挑一個靈感來記錄';
  return pool[taskSuggestIndex % pool.length];
}
function renderTaskArea(){
  renderDateQuickPicks();
  document.getElementById('taskHeading').textContent = `☀️ ${dateLabel(selectedDate)}的偉大事件`;
  document.getElementById('dayTypeLabel').textContent = relativeLabel(selectedDate);
  const rec = getDayRecord(selectedDate);
  document.getElementById('btnWork').className = rec.dayType==='off'?'':'on';
  document.getElementById('btnOff').className = rec.dayType==='off'?'on':'';
  const n = rec.dayType==='off' ? 3 : 1;
  while(rec.tasks.length < n) rec.tasks.push('');
  rec.tasks = rec.tasks.slice(0,n);
  save();
  document.getElementById('taskArea').innerHTML = `
    <div class="big-task">
      ${rec.tasks.map((t,idx)=>`<input type="text" class="txt" style="width:100%;border:none;background:transparent;font-weight:700;" value="${escapeHtml(t)}" oninput="updateTask(${idx}, this.value)" placeholder="這天的重要事情...">`).join('')}
      <div class="row" style="margin-top:6px;"><button class="sm ghost" onclick="rerollTask()">🔄 換一個建議</button></div>
    </div>`;
}
function updateTask(idx, v){ getDayRecord(selectedDate).tasks[idx]=v; getDayRecord(selectedDate).manual=true; save(); }
function rerollTask(){
  const pool = getSuggestionPool();
  if(pool.length) taskSuggestIndex = (taskSuggestIndex+1) % pool.length;
  getDayRecord(selectedDate).tasks[0]=suggestTask();
  save(); renderTaskArea();
}

// ---------- goals ----------
function addGoal(type){
  const el = document.getElementById(type+'Input');
  if(!el.value.trim()) return;
  data.goals[type].push({text:el.value.trim(), done:false});
  el.value=''; saveDraft(type+'Input','');
  renderGoals();
}
function toggleGoal(type, idx){
  data.goals[type][idx].done = !data.goals[type][idx].done; save(); renderGoals();
}
function removeGoal(type, idx){
  data.goals[type].splice(idx,1); save(); renderGoals();
}
function goalListHTML(type){
  return data.goals[type].map((g,idx)=>`<li style="text-decoration:${g.done?'line-through':'none'};color:${g.done?'var(--gray)':'inherit'}">
    <input type="checkbox" ${g.done?'checked':''} onchange="toggleGoal('${type}',${idx})"> ${escapeHtml(g.text)}
    <button class="sm ghost" style="margin-left:6px;" onclick="removeGoal('${type}',${idx})">刪除</button></li>`).join('') || '<li style="color:var(--gray);list-style:none;">尚未新增</li>';
}
function renderGoals(){
  document.getElementById('monthlyList').innerHTML = goalListHTML('monthly');
  document.getElementById('weeklyList').innerHTML = goalListHTML('weekly');
  document.getElementById('futureList').innerHTML = goalListHTML('future');
}
function renderHomeGoals(){
  const w = data.goals.weekly.filter(g=>!g.done).slice(0,3);
  const m = data.goals.monthly.filter(g=>!g.done).slice(0,3);
  document.getElementById('homeGoals').innerHTML = `
    <div style="font-size:13px;color:var(--medium);margin-bottom:4px;">本週</div>
    <ul class="goal-list">${w.map(g=>`<li>${escapeHtml(g.text)}</li>`).join('')||'<li style="color:var(--gray);list-style:none;">尚未設定</li>'}</ul>
    <div style="font-size:13px;color:var(--medium);margin:8px 0 4px;">本月</div>
    <ul class="goal-list">${m.map(g=>`<li>${escapeHtml(g.text)}</li>`).join('')||'<li style="color:var(--gray);list-style:none;">尚未設定</li>'}</ul>`;
}

// ---------- content ----------
function renderIdeaPicker(){
  const opts = data.ideas.filter(i=>!i.used);
  document.getElementById('ideaPicker').innerHTML = '<option value="">— 選擇一個靈感 —</option>' +
    opts.map(i=>`<option value="${i.id}">${escapeHtml(i.text.slice(0,30))}</option>`).join('');
}
function fillFromIdea(){
  const id = document.getElementById('ideaPicker').value;
  const it = data.ideas.find(i=>i.id===id);
  if(it){ document.getElementById('contentSource').value = it.text; saveDraft('contentSource', it.text); }
}
const TEMPLATES = {
  threadsLong: t => `${t}\n\n這件事讓我重新想了一下，其實很多時候我們卡住，不是因為能力不夠，而是想得太多、開始得太少。\n\n如果你也有類似的感覺，也許今天可以先做一件小小的事情，而不是等一切都準備好。`,
  threadsShort: t => `${t}\n\n先做，再調整。`,
  reels: t => `【開頭 Hook】你有沒有想過——${t}？\n\n【核心內容】其實這件事的關鍵是：先從一個很小的行動開始，慢慢累積，而不是等到完美的時機。\n\n【結尾】如果你也有這種感覺，留言告訴我。`,
  story: t => `💭 ${t}\n\n你也有這樣的想法嗎？`,
  carousel: t => `第1頁：${t}\n第2頁：這是我最近的觀察與想法整理...\n第3頁：如果你也認同，歡迎分享給需要的人 ❤️`
};
let lastGenerated = null;
function generateContent(){
  const src = document.getElementById('contentSource').value.trim();
  if(!src){ alert('請先選擇靈感或輸入內容'); return; }
  const type = document.getElementById('contentType').value;
  const text = TEMPLATES[type](src);
  lastGenerated = {type, text, ideaId: document.getElementById('ideaPicker').value || null};
  document.getElementById('genResult').innerHTML = `<div class="content-box">${escapeHtml(text)}</div>
    <div class="row" style="margin-top:8px;"><button class="sm" onclick="saveContent()">儲存這篇</button></div>`;
}
function saveContent(){
  if(!lastGenerated) return;
  data.content.unshift({id:uid(), type:lastGenerated.type, text:lastGenerated.text, date:today, ideaId:lastGenerated.ideaId});
  if(lastGenerated.ideaId){ const it = data.ideas.find(i=>i.id===lastGenerated.ideaId); if(it) it.used = true; }
  lastGenerated = null;
  save(); renderContentList(); renderIdeaPicker();
  document.getElementById('genResult').innerHTML = '<p style="color:var(--gray);font-size:13px;">已儲存 ✅</p>';
}
const TYPE_LABEL = {threadsLong:'Threads長文',threadsShort:'Threads短文',reels:'60秒Reels',story:'IG限動',carousel:'IG輪播'};
function renderContentList(){
  document.getElementById('contentList').innerHTML = data.content.slice(0,10).map(c=>`
    <div class="idea-item"><div class="meta"><span class="tag">${TYPE_LABEL[c.type]}</span>${c.date}</div>
    <div style="font-size:13px;margin-top:4px;white-space:pre-wrap;">${escapeHtml(c.text.slice(0,80))}...</div></div>`).join('') || '<p style="color:var(--gray);font-size:13px;">尚未產生內容</p>';
}

// ---------- review ----------
let reviewType='daily';
const REVIEW_Q = {
  daily: ['今天完成了什麼？','今天哪件事情做得不錯？','今天遇到什麼問題？','今天有什麼新的想法？','今天值得感謝什麼？','明天需要調整什麼？'],
  weekly: ['本週完成什麼','哪些事情沒有完成','哪些事情一直被延後','本週產出了什麼內容','本週有哪些重要靈感','哪些事情值得延續','下週最重要的1~3個方向'],
  monthly: ['本月完成的事情','本月產出的內容','本月重要靈感','本月最大的進步','本月遇到的問題','哪些事情一直沒有完成','下個月值得繼續的事情','下個月最重要的1~3個目標']
};
function setReviewType(t){
  reviewType=t;
  document.querySelectorAll('#reviewTabs button').forEach((b,i)=>b.className = ['daily','weekly','monthly'][i]===t?'on':'');
  renderReviewForm(); renderReviewList();
}
function renderReviewForm(){
  if(!data.drafts.review[reviewType]) data.drafts.review[reviewType] = [];
  const drafts = data.drafts.review[reviewType];
  document.getElementById('reviewForm').innerHTML = REVIEW_Q[reviewType].map((q,idx)=>
    `<div style="margin-bottom:8px;"><div style="font-size:13px;color:var(--medium);margin-bottom:4px;">${q}</div><textarea rows="2" id="rq${idx}" oninput="saveReviewDraft(${idx}, this.value)">${escapeHtml(drafts[idx]||'')}</textarea></div>`).join('');
}
function saveReviewDraft(idx, val){
  if(!data.drafts.review[reviewType]) data.drafts.review[reviewType] = [];
  data.drafts.review[reviewType][idx] = val;
  save();
}
function saveReview(){
  const answers = REVIEW_Q[reviewType].map((q,idx)=>({q, a:document.getElementById('rq'+idx).value}));
  if(answers.every(x=>!x.a.trim())) return;
  data.reviews[reviewType].unshift({date:today, answers});
  data.drafts.review[reviewType] = [];
  save(); renderReviewForm(); renderReviewList();
}
function renderReviewList(){
  const list = data.reviews[reviewType].slice(0,5);
  document.getElementById('reviewList').innerHTML = list.map(r=>`
    <div class="idea-item"><div class="meta">${r.date}</div>
    ${r.answers.filter(a=>a.a.trim()).map(a=>`<div style="font-size:13px;margin-top:4px;"><b>${escapeHtml(a.q)}</b><br>${escapeHtml(a.a)}</div>`).join('')}
    </div>`).join('') || '<p style="color:var(--gray);font-size:13px;">尚無紀錄</p>';
}

// ---------- dashboard ----------
function renderDashboard(){
  const s = [
    ['🎯 本月目標', data.goals.monthly.length],
    ['💡 靈感數', data.ideas.length],
    ['✍🏼 內容產出', data.content.length],
    ['✅ 本週完成', data.goals.weekly.filter(g=>g.done).length]
  ];
  document.getElementById('dashStats').innerHTML = s.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
}

// ---------- export/import ----------
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'uu-ai-assistant-backup.json'; a.click();
}
function importData(evt){
  const file = evt.target.files[0]; if(!file) return;
  if(!confirm('匯入將會覆蓋目前的資料，確定要繼續嗎？')) { evt.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      data = {
        ideas: Array.isArray(parsed.ideas) ? parsed.ideas : [],
        goals: {
          monthly: Array.isArray(parsed.goals?.monthly) ? parsed.goals.monthly : [],
          weekly: Array.isArray(parsed.goals?.weekly) ? parsed.goals.weekly : [],
          future: Array.isArray(parsed.goals?.future) ? parsed.goals.future : []
        },
        content: Array.isArray(parsed.content) ? parsed.content : [],
        reviews: {
          daily: Array.isArray(parsed.reviews?.daily) ? parsed.reviews.daily : [],
          weekly: Array.isArray(parsed.reviews?.weekly) ? parsed.reviews.weekly : [],
          monthly: Array.isArray(parsed.reviews?.monthly) ? parsed.reviews.monthly : []
        },
        tasksByDate: (() => {
          if(parsed.tasksByDate && typeof parsed.tasksByDate==='object') return parsed.tasksByDate;
          if(parsed.todayTask && parsed.todayTask.date){
            return {[parsed.todayTask.date]: {tasks: parsed.todayTask.tasks||[''], dayType: parsed.dayType||'work', manual: !!parsed.todayTask.manual}};
          }
          return {};
        })(),
        drafts: {
          quickIdea: typeof parsed.drafts?.quickIdea==='string' ? parsed.drafts.quickIdea : '',
          newIdea: typeof parsed.drafts?.newIdea==='string' ? parsed.drafts.newIdea : '',
          contentSource: typeof parsed.drafts?.contentSource==='string' ? parsed.drafts.contentSource : '',
          monthlyInput: typeof parsed.drafts?.monthlyInput==='string' ? parsed.drafts.monthlyInput : '',
          weeklyInput: typeof parsed.drafts?.weeklyInput==='string' ? parsed.drafts.weeklyInput : '',
          futureInput: typeof parsed.drafts?.futureInput==='string' ? parsed.drafts.futureInput : '',
          review: {
            daily: Array.isArray(parsed.drafts?.review?.daily) ? parsed.drafts.review.daily : [],
            weekly: Array.isArray(parsed.drafts?.review?.weekly) ? parsed.drafts.review.weekly : [],
            monthly: Array.isArray(parsed.drafts?.review?.monthly) ? parsed.drafts.review.monthly : []
          }
        }
      };
      taskSuggestIndex = 0; lastGenerated = null; activeFilter = null; selectedDate = today;
      save(); renderAll();
      alert('匯入成功！');
    }catch(err){ alert('檔案格式錯誤'); }
  };
  reader.readAsText(file);
}

// ---------- nav ----------
function go(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  if(v==='home'){ renderTaskArea(); renderRecentIdeas(); renderHomeGoals(); }
  else if(v==='ideas'){ renderIdeas(); }
  else if(v==='content'){ renderIdeaPicker(); renderContentList(); }
  else if(v==='goals'){ renderGoals(); }
  else if(v==='review'){ renderReviewList(); }
  else if(v==='dashboard'){ renderDashboard(); }
  window.scrollTo(0,0);
}

function restoreDrafts(){
  document.getElementById('quickIdea').value = data.drafts.quickIdea || '';
  document.getElementById('newIdea').value = data.drafts.newIdea || '';
  document.getElementById('contentSource').value = data.drafts.contentSource || '';
  document.getElementById('monthlyInput').value = data.drafts.monthlyInput || '';
  document.getElementById('weeklyInput').value = data.drafts.weeklyInput || '';
  document.getElementById('futureInput').value = data.drafts.futureInput || '';
}

function renderAll(){
  restoreDrafts();
  renderQuote(); renderTaskArea(); renderRecentIdeas(); renderHomeGoals();
  renderIdeas(); renderGoals(); renderIdeaPicker(); renderContentList();
  renderReviewForm(); renderReviewList(); renderDashboard();
}
renderAll();
</script>
</body>
</html>
